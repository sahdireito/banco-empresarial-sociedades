.btn.roxo{border-color:#7c4bc8;color:#3d1a6b}.btn.roxo:hover{background:#ede6f8}

<script>
const QUESTOES = [
  {num:1, exame:"XLIV Exame — 2025", titulo:"Admissão de Novo Sócio na Sociedade em Conta de Participação", enunciado:"No contrato de sociedade em conta de participação firmado entre o sócio ostensivo e quatro sócios participantes não há cláusula dispondo sobre a admissão de novos sócios.", comando:"Diante da omissão, assinale a afirmativa correta.", gabarito:"C", alt:{"A": "É defeso ao sócio ostensivo admitir novo sócio sem o consentimento expresso ou tácito dos demais sócios, sendo tácito o consentimento se eles não se opuserem nos trinta dias seguintes ao ingresso do novo sócio.", "B": "O sócio ostensivo pode admitir novo sócio com ou sem o consentimento dos demais sócios em razão de sua responsabilidade ilimitada e pessoal pelo exercício da atividade constitutiva do objeto social.", "C": "É defeso ao sócio ostensivo admitir novo sócio sem o consentimento expresso dos demais sócios.", "D": "O sócio ostensivo pode admitir novo sócio com o consentimento da maioria dos demais sócios; havendo empate, cabe a ele o voto de qualidade."}, fb:{"A": "Incorreta. A lei exige consentimento EXPRESSO — não tácito. Silêncio ou ausência de oposição não equivalem à autorização.", "B": "Incorreta. A responsabilidade ilimitada do sócio ostensivo não lhe confere poder unilateral de admitir novos sócios.", "C": "Correta! Art. 995 do CC: salvo estipulação em contrário, o sócio ostensivo não pode admitir novo sócio sem o consentimento EXPRESSO dos demais.", "D": "Incorreta. O CC não prevê deliberação por maioria nessa hipótese — exige o consentimento expresso de TODOS os demais sócios."}, fund:"Art. 995, CC: o sócio ostensivo não pode admitir novo sócio sem o consentimento expresso dos demais sócios, salvo estipulação contratual em contrário.", caqui:"Na SCP, admitir novo sócio exige SIM expresso de todos. Não vale silêncio, não vale maioria, não vale falta de oposição. A palavra-chave é EXPRESSO. A banca adora colocar tácito ou maioria como pegadinha."},
  {num:2, exame:"XLIII Exame — 2025", titulo:"Prorrogação Tácita da Sociedade Constituída por Prazo Determinado", enunciado:"Uma sociedade simples constituída por prazo determinado, até 31 de dezembro de 2023.", comando:"Sobre a situação da sociedade a partir de 1º de janeiro de 2024, assinale a afirmativa correta.", gabarito:"D", alt:{"A": "Ela continuará em atividade normalmente até que algum sócio ou credor requeira sua dissolução judicial nos 30 dias seguintes após o término do prazo de duração.", "B": "Os administradores devem providenciar imediatamente a investidura do liquidante, mantendo os negócios sociais por até 180 dias; findo esse prazo, a continuidade da atividade implica na responsabilidade ilimitada e solidária deles.", "C": "A dissolução judicial da sociedade pode ser requerida por qualquer sócio, devido ao exaurimento do fim social, cabendo ao Juiz a nomeação do liquidante.", "D": "A sociedade reputa-se dissolvida em razão do vencimento do prazo de duração, salvo se, sem oposição de sócio, não entrar a sociedade em liquidação, caso em que se prorrogará por tempo indeterminado."}, fb:{"A": "Incorreta. Não existe prazo de 30 dias para requerimento de dissolução nessa hipótese específica.", "B": "Incorreta. O CC não estabelece esse prazo de 180 dias nem essa consequência automática para os administradores.", "C": "Incorreta. O fundamento não é exaurimento do fim social, mas vencimento do prazo — a dissolução pode ser evitada pela prorrogação tácita.", "D": "Correta! Art. 1.033, I e parágrafo único, CC: vencido o prazo, se nenhum sócio se opuser e a sociedade não entrar em liquidação, prorroga-se automaticamente por tempo indeterminado."}, fund:"Art. 1.033, I e parágrafo único, CC: dissolução pelo vencimento do prazo, salvo prorrogação tácita quando nenhum sócio se opõe e a sociedade não entra em liquidação.", caqui:"Prazo venceu, ninguém reclamou, sociedade seguiu operando? Prorrogou automaticamente por tempo indeterminado. Mas basta UM sócio se opor para isso não acontecer."},
  {num:3, exame:"XLIII Exame — 2025", titulo:"Responsabilidade dos Sócios na Sociedade em Comum", enunciado:"Lucélia, Marília e Natividade constituíram uma sociedade empresária sem levar o documento escrito de constituição a qualquer registro. Ficou estabelecido verbalmente que os atos sociais seriam praticados por Marília, no interesse comum. Inadimplida uma obrigação social, o credor demandou a sociedade e todas as sócias, responsabilizando-as solidariamente e sem benefício de ordem pela obrigação assumida por Marília.", comando:"Considerados tais fatos, assinale a afirmativa correta.", gabarito:"B", alt:{"A": "O credor não poderia demandar a sociedade em razão da ausência de personalidade jurídica, sendo possível exigir de todas as sócias, solidariamente e sem benefício de ordem, a obrigação assumida por Marília.", "B": "O credor agiu corretamente ao demandar a sociedade, ainda que diante da ausência de personalidade jurídica; contudo, mesmo havendo solidariedade entre as sócias, Lucélia e Natividade possuem benefício de ordem.", "C": "O credor está autorizado a demandar a sociedade, como também poderá responsabilizar as sócias Lucélia e Natividade, solidariamente e sem benefício de ordem, pela obrigação assumida por Marília.", "D": "O credor está totalmente equivocado, pois a sociedade não poderia ser demandada, e deve ser respeitado o benefício de ordem das sócias Lucélia e Natividade."}, fb:{"A": "Incorreta. A sociedade em comum PODE ser demandada judicialmente — arts. 986-990, CC.", "B": "Correta! A sociedade em comum pode ser demandada. Todos respondem solidária e ilimitadamente — mas apenas Marília (que contratou) perde o benefício de ordem. Lucélia e Natividade o conservam.", "C": "Incorreta. Lucélia e Natividade têm benefício de ordem — o credor deve exaurir primeiro os bens sociais antes de atingir os bens particulares delas.", "D": "Incorreta. A sociedade em comum pode ser parte em juízo, e o benefício de ordem existe para as sócias que não contrataram."}, fund:"Art. 990, CC: todos os sócios respondem solidária e ilimitadamente, excluído do benefício de ordem o que contratou pela sociedade.", caqui:"Quem assinou o contrato perde o benefício de ordem. Quem não assinou ainda tem o benefício: credor precisa exaurir os bens sociais primeiro. Marília assinou = sem benefício. Lucélia e Natividade = com benefício."},
  {num:4, exame:"XLIII Exame — 2025", titulo:"Nome Empresarial da Companhia", enunciado:"Bento de Abreu e Bernardino de Campos são os únicos sócios e fundadores da sociedade empresária Abreu &amp; Campos Ltda. Os sócios deliberaram a transformação da sociedade de limitada para companhia e lhe pediram orientação sobre o nome empresarial.", comando:"Considerando algumas das regras para a formação do nome empresarial do tipo que a sociedade adotará, assinale a afirmativa correta.", gabarito:"A", alt:{"A": "A companhia adotará denominação, na qual poderá constar o(s) nome(s) do(s) fundador(es), sendo facultada a designação do objeto social.", "B": "A companhia adotará firma, sendo formada por nome de fantasia a partir da escolha dos sócios, seguido obrigatoriamente pela designação do objeto social.", "C": "A companhia adotará denominação, formada apenas pelo nome dos sócios, seguida facultativamente pela expressão Sociedade Anônima ou Companhia, indicadas unicamente ao final.", "D": "A companhia poderá adotar firma ou denominação, devendo ser mantido o nome antigo Abreu &amp; Campos, substituindo-se o aditivo Ltda. pelo aditivo Companhia ou Cia."}, fb:{"A": "Correta! S.A. adota DENOMINAÇÃO (nunca firma). Pode conter nome dos fundadores e indicação do objeto — este último facultativo. Art. 3º, LSA.", "B": "Incorreta. Companhia não adota firma — somente denominação.", "C": "Incorreta. Não é obrigatório conter só nomes dos sócios. E Companhia ou S.A. pode aparecer no início também.", "D": "Incorreta. Companhia não pode adotar firma. Não há obrigação de manter o nome anterior."}, fund:"Art. 3º, Lei 6.404/76 (LSA): a S.A. adota exclusivamente denominação, que pode conter nome de fundador/acionista e deve incluir Companhia, Cia., Sociedade Anônima ou S.A. Objeto social é facultativo.", caqui:"Regra de ouro: S.A. = denominação. NUNCA firma. A banca adora trocar denominação por firma nas alternativas erradas."},
  {num:5, exame:"42º Exame — 2024", titulo:"Dissolução de Pleno Direito da Sociedade Simples", enunciado:"F. Beltrão, G. Carneiro e S. Moreira decidiram constituir uma sociedade do tipo simples de prazo indeterminado, que entrou em atividade na data da assinatura do contrato, levado a registro na semana seguinte, no Registro Civil de Pessoas Jurídicas.", comando:"Assinale a opção que indica a hipótese de dissolução de pleno direito dessa sociedade.", gabarito:"B", alt:{"A": "A deliberação dos sócios, por maioria absoluta do capital.", "B": "O esgotamento da exploração do objeto social ou verificada a sua inexequibilidade.", "C": "O falecimento de qualquer dos sócios, independentemente de optarem pela dissolução.", "D": "A existência de apenas um sócio, não reconstituída a pluralidade em até 180 (cento e oitenta) dias."}, fb:{"A": "Incorreta. Em sociedade simples de prazo indeterminado, a dissolução por deliberação exige unanimidade, salvo contrato em contrário.", "B": "Correta! Art. 1.033, II, CC: dissolução de pleno direito quando o fim social se exaure ou sua realização torna-se inexequível.", "C": "Incorreta. A morte de sócio gera resolução em relação ao sócio — não dissolução total automática.", "D": "Incorreta. A regra dos 180 dias para reconstituição da pluralidade é prevista para sociedade limitada — não configura dissolução de pleno direito da sociedade simples conforme cobrado."}, fund:"Art. 1.033, II, CC: dissolução de pleno direito pelo exaurimento do fim social ou pela verificação de sua inexequibilidade.", caqui:"Dissolução de pleno direito = acontece automaticamente. Na sociedade simples de prazo indeterminado, isso ocorre quando o objeto acabou ou ficou impossível. Fim do objeto = fim da sociedade de pleno direito."},
  {num:6, exame:"XLI Exame — 2024", titulo:"Regra Aplicável à Sociedade Limitada Unipessoal e Pluripessoal", enunciado:"Em 2019, a constituição da sociedade limitada unipessoal, de modo permanente, passou a ser possível. Apenas uma das opções apresenta norma aplicável tanto às sociedades limitadas pluripessoais quanto às unipessoais.", comando:"Assinale-a.", gabarito:"C", alt:{"A": "A possibilidade de realização de deliberações em reunião ou assembleia.", "B": "A ocorrência de dissolução de pleno direito mediante distrato.", "C": "A possibilidade de designação de administrador em ato separado.", "D": "A solidariedade pela exata estimação dos bens conferidos ao capital social."}, fb:{"A": "Incorreta. Reunião e assembleia pressupõem pluralidade de sócios — inviável na unipessoal.", "B": "Incorreta. Distrato requer acordo entre duas ou mais partes — impossível com um único sócio.", "C": "Correta! Art. 1.060, CC: o administrador pode ser designado em ato separado tanto na limitada pluripessoal quanto na unipessoal.", "D": "Incorreta. Solidariedade entre sócios pressupõe pluralidade — não faz sentido com uma só pessoa."}, fund:"Art. 1.060, CC: administrador da limitada pode ser designado no contrato social ou em ato separado — regra válida para ambas as modalidades.", caqui:"A lógica da questão: o que faz sentido com apenas UM sócio? Reunião e assembleia = precisa de mais de um. Distrato = precisa de acordo entre partes. Solidariedade = precisa de mais de um responsável. Designar administrador em ato separado = funciona com um ou vários sócios."},
  {num:7, exame:"XXXVIII Exame — 2023", titulo:"Copropriedade de Quota na Sociedade Limitada", enunciado:"Cambira e Mallet adquiriram 1 (uma) quota da sociedade limitada Imbaú Ensino Superior Ltda. no valor de R$ 250.000,00, sendo, portanto, condôminos desta quota.", comando:"Considerando a situação de copropriedade da quota, assinale a afirmativa correta.", gabarito:"B", alt:{"A": "Cambira não poderá ceder sua parte ideal no condomínio a outro sócio ou a terceiro em razão da indivisibilidade da quota em relação à sociedade.", "B": "Cambira e Mallet respondem solidariamente perante a sociedade pelas prestações necessárias à integralização da quota.", "C": "Os direitos inerentes à quota poderão ser exercidos separadamente por cada condômino, não se aplicando a indivisibilidade da quota neste caso.", "D": "Cambira poderá ceder sua parte ideal tanto para outro sócio quanto para terceiro independentemente de audiência dos demais sócios, ainda que omisso o contrato."}, fb:{"A": "Incorreta. A parte ideal no condomínio pode ser cedida — a indivisibilidade é perante a sociedade, não entre os condôminos.", "B": "Correta! Art. 1.056, §1º, CC: condôminos respondem solidariamente pelas prestações necessárias à integralização da quota.", "C": "Incorreta. Os direitos da quota são exercidos por representante comum — não separadamente por cada condômino.", "D": "Incorreta. A cessão da parte ideal sujeita-se às regras legais e contratuais sobre cedência de quotas."}, fund:"Art. 1.056, §1º, CC: no condomínio de quota, os direitos são exercidos por representante comum e todos os condôminos respondem solidariamente pela integralização.", caqui:"Quota em condomínio: indivisível perante a sociedade, mas divisível entre os condôminos internamente. Para integralizar, a sociedade pode cobrar de qualquer um dos condôminos — são solidários."},
  {num:8, exame:"XXXVII Exame — 2023", titulo:"Nome Empresarial da Sociedade Simples Limitada", enunciado:"Três médicos decidiram constituir uma sociedade do tipo limitada cujo objeto é simples, consoante a classificação das sociedades no Código Civil.", comando:"Acerca da designação a ser adotada pela sociedade e sua qualificação jurídica, assinale a afirmativa correta.", gabarito:"B", alt:{"A": "Por não ter a futura sociedade natureza empresária, não poderá adotar nome empresarial, sendo livre a formação de sua designação, sem incidência das regras de formação do nome da sociedade limitada.", "B": "A futura sociedade terá nome empresarial, pois tanto as regras de formação quanto de proteção ao nome empresarial se aplicam indistintamente às sociedades simples e empresárias.", "C": "Embora a futura sociedade não tenha nome empresarial, por não exercer empresa, a formação de sua designação obedecerá às regras para a formação do nome empresarial do tipo limitada.", "D": "Independentemente da natureza da futura sociedade, ela terá nome empresarial, devendo adotar denominação, mas é facultativa a palavra limitada ou sua abreviatura ao final."}, fb:{"A": "Incorreta. Sociedades simples também têm nome empresarial — a natureza simples não afasta essa proteção.", "B": "Correta! Art. 1.150, CC: tanto sociedades simples quanto empresárias têm nome empresarial protegido. As regras de formação e proteção se aplicam a ambas.", "C": "Incorreta. A sociedade simples POSSUI nome empresarial.", "D": "Incorreta. Limitada ou Ltda. é OBRIGATÓRIO, não facultativo, na sociedade limitada."}, fund:"Art. 1.150 e 1.155, CC: a proteção ao nome empresarial aplica-se igualmente a sociedades simples e empresárias. Se adota o tipo limitada, deve usar Limitada ou Ltda. — obrigatório.", caqui:"Erro clássico: achar que só sociedade empresária tem nome empresarial. Não — sociedade simples também tem, e recebe a mesma proteção. E quando adota o tipo limitada, Ltda. é obrigatório."},
  {num:9, exame:"XXXVII Exame — 2023", titulo:"Responsabilidade na Sociedade em Comum perante Terceiro", enunciado:"Lauro e Moysés constituem sociedade para prestação de serviços de informática, mas não levam o contrato a arquivamento na Junta Comercial. Lauro, em seu nome, mas agindo no interesse dele e de Moysés, celebra contrato com Agnes. Agnes desconhecia a existência da sociedade. Inadimplido o contrato, Agnes tomou conhecimento da existência da sociedade por confissão de Lauro.", comando:"Com base nessas informações, Agnes poderá ter seu crédito satisfeito com o produto da alienação judicial dos", gabarito:"A", alt:{"A": "Bens sociais de titularidade comum dos sócios Lauro e Moysés e de seus bens particulares, devendo exaurir primeiro os bens sociais para, posteriormente e se necessário, atingir os bens dos sócios, sendo que Lauro está excluído do benefício de ordem por ter contratado no interesse da sociedade.", "B": "Bens particulares de Lauro, por desconhecer a existência da sociedade, sem possibilidade de excussão dos bens sociais ou dos de Moysés, por esse não ter contratado no interesse da sociedade.", "C": "Bens sociais de titularidade comum dos sócios Lauro e Moysés e dos bens particulares de Lauro, mas não há possibilidade de atingir os bens particulares de Moysés, já que este não contratou no interesse da sociedade.", "D": "Bens sociais de titularidade comum dos sócios Lauro e Moysés, considerando a existência de autonomia patrimonial da sociedade, sem possibilidade de excussão dos bens particulares dos sócios Lauro e Moysés."}, fb:{"A": "Correta! Na sociedade em comum: bens sociais respondem primeiro. Se insuficientes, atingem-se os bens dos sócios. Lauro (que contratou) perde o benefício de ordem. Moysés o conserva — mas também responde com seus bens particulares após exauridos os sociais.", "B": "Incorreta. Agnes pode atingir os bens sociais e os de Moysés (com benefício de ordem), não apenas os de Lauro.", "C": "Incorreta. Os bens de Moysés também podem ser atingidos — com benefício de ordem, após exauridos os bens sociais.", "D": "Incorreta. A sociedade em comum não tem autonomia patrimonial plena que impeça a execução dos bens dos sócios."}, fund:"Arts. 988 e 990, CC: sociedade em comum tem patrimônio especial (bens sociais). Todos respondem solidária e ilimitadamente. O sócio que contratou perde o benefício de ordem. Os demais o conservam.", caqui:"Sociedade em comum tem um cofre coletivo (bens sociais) que responde primeiro. Depois vêm os bens pessoais dos sócios. Quem assinou vai junto com o cofre (sem benefício de ordem). Quem não assinou entra depois (com benefício de ordem, mas ainda responde)."},
  {num:10, exame:"XXXVI Exame — 2022", titulo:"Exclusão Extrajudicial de Sócio Minoritário na Sociedade Limitada", enunciado:"A sociedade Corinto &amp; Curvelo Ltda. é composta apenas por dois sócios, sendo o sócio Corinto titular de 40% do capital e o sócio Curvelo titular do restante. Nesta situação, a exclusão extrajudicial motivada do sócio minoritário de sociedade limitada poderá ser realizada pelo sócio Curvelo, independentemente de ter havido", comando:"Assinale a alternativa correta.", gabarito:"D", alt:{"A": "Justa causa, ou seja, de modo discricionário.", "B": "Previsão no contrato de exclusão por justa causa.", "C": "Alteração do contrato social.", "D": "Reunião ou assembleia especial para esse fim."}, fb:{"A": "Incorreta. Justa causa é OBRIGATÓRIA para exclusão extrajudicial — não pode ser discricionária.", "B": "Incorreta. Previsão contratual expressa de exclusão por justa causa é requisito indispensável.", "C": "Incorreta. A exclusão se formaliza justamente por alteração do contrato social.", "D": "Correta! Em sociedade com apenas 2 sócios, o STJ entende que a reunião ou assembleia especial pode ser dispensada — seria mera formalidade inútil, pois a maioria já está definida com o único sócio remanescente."}, fund:"Art. 1.085 e parágrafo único, CC + entendimento do STJ: em sociedade bipartite (2 sócios), a convocação de assembleia/reunião especial para exclusão pode ser dispensada. Justa causa, cláusula contratual e alteração do contrato permanecem obrigatórios.", caqui:"Com apenas 2 sócios, fazer uma assembleia para excluir o sócio minoritário seria votar sozinho — o resultado já está definido. Por isso o STJ dispensa essa formalidade. Mas justa causa, cláusula contratual e alteração do contrato continuam sendo exigências intocáveis."},
  {num:11, exame:"XXXIV Exame — 2022", titulo:"Critério de Distribuição dos Resultados na Sociedade Cooperativa", enunciado:"A sociedade cooperativa é dotada de características próprias que lhe atribuem singularidade em relação a outros tipos societários, dentre elas o critério de distribuição de resultados.", comando:"Das alternativas abaixo, assinale a única que indica corretamente tal critério.", gabarito:"C", alt:{"A": "A distribuição dos resultados é realizada proporcionalmente ao valor da quota-parte de cada sócio, salvo disposição diversa do estatuto.", "B": "A distribuição dos resultados é realizada proporcionalmente ao valor dos bens conferidos por cada cooperado, para formação do capital social.", "C": "A distribuição dos resultados é realizada proporcionalmente ao valor das operações efetuadas pelo sócio com a sociedade, podendo ser atribuído juro fixo ao capital realizado.", "D": "A distribuição dos resultados é realizada proporcionalmente à contribuição de cada cooperado, para formação dos Fundos de Reserva e de Assistência Técnica Educacional e Social."}, fb:{"A": "Incorreta. Nas cooperativas, os resultados não são distribuídos por quota-parte como nas sociedades empresárias tradicionais.", "B": "Incorreta. O valor dos bens conferidos ao capital não é o critério de distribuição.", "C": "Correta! Art. 1.094, VII, CC: na cooperativa, os resultados são distribuídos proporcionalmente às operações realizadas pelo cooperado com a sociedade (retorno cooperativo). Pode haver juro fixo sobre o capital.", "D": "Incorreta. Os fundos são reservas obrigatórias — não são critério de distribuição de resultados."}, fund:"Art. 1.094, VII, CC: distribuição dos resultados proporcionalmente ao valor das operações efetuadas pelo sócio com a sociedade, podendo ser atribuído juro fixo ao capital realizado.", caqui:"Na cooperativa, ganha mais quem mais cooperou — não quem mais investiu. É o retorno cooperativo: proporcional às operações que você fez com a própria cooperativa. Diferente das S.A. e limitadas, onde o lucro segue o capital."},
  {num:12, exame:"XXXIV Exame — 2022", titulo:"Classes de Ações Ordinárias em Companhia Fechada", enunciado:"Na companhia fechada Gráfica Redenção da Serra S/A, o estatuto prevê a criação de classes de ações ordinárias em função de: I. Conversibilidade em ações preferenciais; II. Atribuição de voto plural na razão de 5 (cinco) votos por 1 (uma) ação ordinária.", comando:"Ao analisar a cláusula estatutária, você conclui que ela é", gabarito:"C", alt:{"A": "Parcialmente válida, pois é nula a atribuição de voto plural a qualquer classe de ação ordinária, porém é possível a conversibilidade em ações preferenciais.", "B": "Parcialmente nula, pois é válida no tocante à atribuição de voto plural, já que não excede o limite de 10 votos por ação, e nula no tocante à conversibilidade em ações preferenciais.", "C": "Plenamente válida, pois ambos os parâmetros adotados pelo estatuto (voto plural e conversibilidade em ações preferenciais) são possíveis e lícitos nas companhias fechadas.", "D": "Totalmente nula, pois são vedadas tanto a conversibilidade de ações ordinárias em preferenciais quanto a atribuição de voto plural nas companhias fechadas."}, fb:{"A": "Incorreta. O voto plural é permitido nas companhias fechadas desde a Lei 14.195/2021.", "B": "Incorreta. A conversibilidade também é expressamente permitida.", "C": "Correta! A Lei 14.195/2021 alterou a LSA para permitir voto plural (até 10 votos/ação) nas companhias fechadas. A conversibilidade de ações ordinárias em preferenciais também é admitida. Ambas as cláusulas são válidas.", "D": "Incorreta. Ambas as hipóteses são legalmente autorizadas após a Lei 14.195/2021."}, fund:"Art. 15, §§1º e 2º, LSA (Lei 6.404/76), com alterações da Lei 14.195/2021: companhia fechada pode criar classes de ações ordinárias com voto plural (até 10x) e com conversibilidade em preferenciais.", caqui:"Atenção à atualização legislativa! Antes da Lei 14.195/2021, voto plural era vedado. Hoje é permitido em companhias fechadas, limitado a 10 votos por ação. A questão coloca 5 votos — dentro do limite. Candidato desatualizado vai marcar A ou D e errar."},
  {num:13, exame:"XXXIII Exame — 2021", titulo:"Reuniões e Assembleias Digitais na Sociedade Limitada", enunciado:"Em razão das medidas de isolamento social propagadas nos anos de 2020 e 2021, muitos administradores precisaram de orientação quanto à licitude da realização de reuniões ou assembleias de sócios nas sociedades limitadas, de forma digital, ou à possibilidade do modelo híbrido.", comando:"Assinale a afirmativa que apresenta a orientação correta.", gabarito:"D", alt:{"A": "Na sociedade limitada é vedada tanto a reunião ou assembleia de sócios, de forma digital, quanto a participação do sócio e o voto à distância.", "B": "Na sociedade limitada é vedada a reunião ou assembleia de sócios, de forma digital, mas é possível a participação de sócio e o voto à distância.", "C": "Na sociedade limitada é vedada a participação e voto à distância nas reuniões e assembleias, mas é possível a reunião ou assembleia de forma digital.", "D": "Na sociedade limitada é possível tanto a reunião ou a assembleia de sócios, de forma digital, quanto a participação do sócio e o voto à distância."}, fb:{"A": "Incorreta. O art. 1.080-A do CC (incluído pela Lei 14.030/2020) autoriza expressamente reuniões/assembleias digitais.", "B": "Incorreta. Tanto a reunião digital quanto o voto à distância são permitidos.", "C": "Incorreta. Participação e voto à distância também são admitidos.", "D": "Correta! Art. 1.080-A, CC (Lei 14.030/2020): é permitida reunião/assembleia totalmente digital, modelo híbrido, participação remota e voto à distância — com plena validade jurídica."}, fund:"Art. 1.080-A, CC (incluído pela Lei 14.030/2020): as deliberações dos sócios podem ser realizadas por meio digital, com participação remota e voto à distância.", caqui:"A pandemia acelerou o que o direito já estava caminhando: reunião de sócios pode ser 100% online, híbrida, ou presencial com sócio votando à distância. Tudo vale. A Lei 14.030/2020 formalizou isso no CC."},
  {num:14, exame:"XXXII Exame — 2021", titulo:"Sociedade Estrangeira com Sucursal no Brasil", enunciado:"Andropoulos Inc. é uma sociedade constituída na Grécia. Se essa sociedade quiser atuar no Brasil por meio de uma sucursal em São Paulo, será necessário", comando:"Assinale a afirmativa correta.", gabarito:"D", alt:{"A": "Ter, permanentemente, representante no Brasil, com poderes para resolver quaisquer questões, exceto receber citação judicial pela sociedade.", "B": "Transferir sua sede para o Brasil, na hipótese de nacionalizar-se, mediante deliberação unânime de seus sócios, independentemente de autorização do Poder Executivo.", "C": "Obter autorização do Poder Executivo e, em até seis meses do início de sua atividade, realizar sua inscrição na Junta Comercial do Estado de São Paulo.", "D": "Sujeitar-se às leis e aos tribunais brasileiros quanto às operações praticadas no Brasil, e qualquer modificação no contrato dependerá da aprovação do Poder Executivo para produzir efeitos no país."}, fb:{"A": "Incorreta. O representante DEVE ter poderes para receber citação judicial — art. 1.135, CC.", "B": "Incorreta. A nacionalização depende de autorização do Poder Executivo.", "C": "Incorreta. A inscrição na Junta Comercial deve ocorrer ANTES do início das atividades — não em até 6 meses depois.", "D": "Correta! Art. 1.137 e 1.138, CC: a sociedade estrangeira se sujeita às leis e tribunais brasileiros para operações no Brasil, e qualquer alteração contratual depende de aprovação do Poder Executivo para produzir efeitos aqui."}, fund:"Arts. 1.134 a 1.138, CC: sociedade estrangeira precisa de autorização do Poder Executivo, inscrição prévia na Junta, representante com poderes inclusive para citação, sujeição às leis/tribunais brasileiros e aprovação federal para alterações contratuais.", caqui:"Sociedade estrangeira que quer atuar no Brasil: autorização do Executivo, inscrição na Junta (antes, não depois), representante que pode receber citação, submissão às leis e tribunais brasileiros, nova aprovação federal para qualquer mudança no contrato."},
  {num:15, exame:"XXXII Exame — 2021", titulo:"Sociedade Limitada Unipessoal", enunciado:"Alexandre Larocque pretende constituir sociedade do tipo limitada sem se reunir a nenhuma outra pessoa e consulta sua advogada para saber a possibilidade de efetivar sua pretensão.", comando:"Assinale a opção que apresenta a resposta dada pela advogada ao seu cliente.", gabarito:"A", alt:{"A": "É possível. A sociedade limitada pode ser constituída por uma pessoa, hipótese em que se aplicarão ao ato de instituição, no que couberem, as disposições sobre o contrato social.", "B": "Não é possível. A sociedade limitada só pode ser unipessoal acidentalmente e pelo prazo máximo de 180 dias, nos casos em que remanescer apenas um sócio pessoa natural.", "C": "Não é possível. Apenas a empresa pública e a subsidiária integral podem ser sociedades unipessoais e constituídas com apenas sócio pessoa jurídica.", "D": "É possível, desde que o capital mínimo da sociedade limitada seja igual ou superior a 100 (cem) salários mínimos e esteja totalmente integralizado."}, fb:{"A": "Correta! Art. 1.052, §1º, CC (Lei 13.874/2019): a sociedade limitada pode ser constituída por uma única pessoa — sem capital mínimo, sem prazo, de forma permanente.", "B": "Incorreta. A unipessoalidade pode ser permanente desde 2019 — não apenas acidental.", "C": "Incorreta. Pessoa natural também pode constituir SLU.", "D": "Incorreta. A exigência de 100 salários mínimos era da EIRELI (extinta em 2021). A SLU não tem capital mínimo."}, fund:"Art. 1.052, §§1º e 2º, CC (redação da Lei 13.874/2019): a sociedade limitada pode ser unipessoal de forma permanente, sem capital mínimo exigido. A EIRELI foi extinta e convertida em SLU (Lei 14.195/2021).", caqui:"Desde 2019 existe a SLU — Sociedade Limitada Unipessoal. Alexandre pode abrir uma limitada sozinho, com qualquer valor de capital, de forma permanente. Não confunda com a antiga EIRELI (extinta em 2021 — exigia 100 salários mínimos). SLU = simples, sem capital mínimo, sem sócio obrigatório."},
  {num:16, exame:"XXXI Exame — 2020", titulo:"Contrato de Agência: Zona Geográfica e Mandato", enunciado:"Duas sociedades empresárias celebraram contrato de agência, que assumiu a obrigação de promover, sem vínculos de dependência, a realização de certos negócios com exclusividade nos municípios integrantes da região metropolitana de Curitiba. Ficou pactuado que as proponentes conferirão poderes à agente para que esta as represente, como mandatária, na conclusão dos contratos.", comando:"Sobre a hipótese apresentada, considerando as disposições legais relativas ao contrato de agência, assinale a afirmativa correta.", gabarito:"A", alt:{"A": "Não há ilegalidade quanto à delimitação de zona geográfica para atuação exclusiva do agente, bem como em relação à possibilidade de ser o agente mandatário das proponentes, por serem características do contrato de agência.", "B": "Há ilegalidade na fixação de zona determinada para atuação exclusiva do agente, por ferir a livre concorrência entre agentes, mas não há ilegalidade na outorga de mandato ao agente para representação das proponentes.", "C": "Há ilegalidade tanto na outorga de mandato ao agente quanto na fixação de zona determinada para atuação exclusiva do agente.", "D": "Não há ilegalidade quanto à fixação de zona determinada para atuação exclusiva do agente, mas há ilegalidade quanto à concessão de mandato ao agente."}, fb:{"A": "Correta! Art. 710 e parágrafo único, CC: o contrato de agência admite zona determinada (inclusive com exclusividade) e outorga de mandato ao agente para concluir contratos.", "B": "Incorreta. A delimitação de zona é expressamente prevista no art. 710, CC.", "C": "Incorreta. Ambas as cláusulas são legalmente admitidas.", "D": "Incorreta. A outorga de mandato é expressamente prevista no parágrafo único do art. 710, CC."}, fund:"Art. 710 e parágrafo único, CC: o contrato de agência pode estabelecer zona determinada e o proponente pode conferir poderes ao agente para representá-lo na conclusão dos contratos.", caqui:"O contrato de agência tem dois elementos que a banca adora questionar: pode ter zona exclusiva — sim, expressamente previsto; e o agente pode receber mandato para fechar contratos — sim, também previsto. Ambas as cláusulas são válidas."},
  {num:17, exame:"XXXI Exame — 2020", titulo:"Integralização de Quota em Condomínio na Sociedade Limitada", enunciado:"Anadia e Deodoro são condôminos de uma quota de sociedade limitada no valor de R$ 13.000,00. Nem a quota nem o capital da sociedade — fixado em R$ 50.000,00 — se encontram integralizados. Você é consultado sobre a possibilidade de a sociedade demandar os condôminos para que integralizem a referida quota.", comando:"Assinale a opção que apresenta a resposta correta.", gabarito:"C", alt:{"A": "Eles são obrigados à integralização apenas a partir da decretação de falência da sociedade.", "B": "Eles não são obrigados à integralização, pelo fato de serem condôminos de quota indivisa.", "C": "Eles são obrigados à integralização, porque todos os sócios, mesmo os condôminos, devem integralizar o capital.", "D": "Eles não são obrigados à integralização, porque o capital da sociedade é inferior a 100 salários mínimos."}, fb:{"A": "Incorreta. A obrigação de integralizar é desde a subscrição — não depende de falência.", "B": "Incorreta. O condomínio da quota não afasta a obrigação de integralização — os condôminos respondem solidariamente por ela.", "C": "Correta! Art. 1.056, §1º, CC: todos os condôminos respondem solidariamente pela integralização. A sociedade pode demandar qualquer um deles.", "D": "Incorreta. Não existe exigência de capital mínimo de 100 salários mínimos para sociedade limitada — isso era da EIRELI (extinta)."}, fund:"Art. 1.056, §1º, CC: condôminos de quota respondem solidariamente pelas prestações necessárias à integralização.", caqui:"Copropriedade de quota não é desculpa para não integralizar. A sociedade pode cobrar de qualquer um dos condôminos — solidariamente. Também não confunda com a exigência de 100 salários mínimos: isso era da EIRELI (extinta). Limitada não tem capital mínimo."},
  {num:18, exame:"XXXI Exame — 2020", titulo:"Morte de Sócio na Sociedade Limitada sem Regra Contratual", enunciado:"No contrato da sociedade empresária Arealva Calçados Finos Ltda., não consta cláusula de regência supletiva pelas disposições de outro tipo societário. Ademais, tanto no contrato social quanto nas disposições legais relativas ao tipo adotado pela sociedade não há norma regulando a sucessão por morte de sócio.", comando:"Diante da situação narrada, assinale a afirmativa correta.", gabarito:"A", alt:{"A": "Haverá resolução da sociedade em relação ao sócio em caso de morte.", "B": "Haverá transmissão causa mortis da quota social.", "C": "Caberá aos sócios remanescentes regular a substituição do sócio falecido.", "D": "Os sócios serão obrigados a incluir, no contrato, cláusula dispondo sobre a sucessão por morte de sócio."}, fb:{"A": "Correta! Na ausência de previsão contratual, a morte do sócio gera a resolução da sociedade em relação ao sócio falecido — as quotas são liquidadas e os haveres pagos aos herdeiros. Estes não ingressam automaticamente na sociedade.", "B": "Incorreta. A transmissão automática das quotas aos herdeiros não é a regra na ausência de cláusula contratual.", "C": "Incorreta. Não há obrigação de substituição — a liquidação da quota é a consequência padrão.", "D": "Incorreta. Não existe obrigação legal de inserir essa cláusula."}, fund:"Art. 1.028, CC: na omissão do contrato, a morte do sócio gera resolução da sociedade em relação ao falecido, com liquidação das quotas, salvo as exceções dos incisos I a III (previsão contratual diversa, dissolução total ou acordo com herdeiros para substituição).", caqui:"Silêncio do contrato sobre morte de sócio = liquidação da quota. Os herdeiros recebem dinheiro, não entram na sociedade. É uma resolução parcial — a sociedade continua com os sócios sobreviventes. Herdeiro não vira sócio automaticamente."},
  {num:19, exame:"XXVIII Exame — 2019", titulo:"Responsabilidade do Sócio Retirante na Reclamação Trabalhista", enunciado:"Alaor retirou-se da sociedade empresária e averbou, na respectiva Junta Comercial, novo contrato social, onde constava sua retirada. O empresário, 36 meses após esse fato, foi surpreendido com sua citação em uma reclamação trabalhista ajuizada dias antes.", comando:"Sobre a hipótese apresentada, considerando a atual redação da Consolidação das Leis do Trabalho, assinale a afirmativa correta.", gabarito:"C", alt:{"A": "Alaor responde solidariamente pelos débitos da sociedade na ação trabalhista em referência.", "B": "Alaor responde subsidiariamente pelos débitos da sociedade na ação trabalhista em referência.", "C": "Alaor não mais responde, na ação trabalhista em referência, pelos débitos da sociedade.", "D": "No caso, primeiro responde a empresa devedora, depois os sócios atuais e, em seguida, os sócios retirantes, que é o caso de Alaor."}, fb:{"A": "Incorreta. Alaor não mais responde — o prazo de 2 anos já se esgotou.", "B": "Incorreta. Alaor poderia responder subsidiariamente, mas apenas dentro dos 2 anos após a averbação da retirada.", "C": "Correta! Art. 10-A, CLT (Lei 13.467/2017): o sócio retirante responde subsidiariamente pelas obrigações trabalhistas pelo prazo de 2 anos após a averbação da retirada. Alaor se retirou há 36 meses (3 anos) — prazo já expirado.", "D": "Incorreta. A responsabilidade de Alaor cessou pelo decurso do prazo de 2 anos."}, fund:"Art. 10-A, CLT (Lei 13.467/2017): o sócio retirante responde subsidiariamente pelas obrigações trabalhistas da sociedade, relativas ao período em que figurou como sócio, somente em ações ajuizadas até 2 anos após a averbação de sua retirada. Alaor retirou-se há 36 meses — prazo expirado.", caqui:"A Reforma Trabalhista criou o art. 10-A na CLT: sócio retirante responde por débitos trabalhistas do período em que era sócio, mas apenas se acionado dentro de 2 anos da averbação da saída. Alaor se retirou há 3 anos — passou do prazo. Não responde mais."},
  {num:20, exame:"XXVII Exame — 2018", titulo:"Regras Básicas da Sociedade Cooperativa", enunciado:"Um grupo de prestadores de serviços procurou orientação sobre o funcionamento de uma cooperativa.", comando:"Sobre as regras básicas de funcionamento de uma cooperativa, assinale a afirmativa correta.", gabarito:"B", alt:{"A": "O estatuto da cooperativa deve ser aprovado previamente pela Junta Comercial do Estado da Federação onde estiver a sede, sendo arquivado no Registro Civil de Pessoas Jurídicas.", "B": "Na sociedade cooperativa, cada sócio tem direito a um só voto nas deliberações sociais, tenha ou não capital a sociedade, e qualquer que seja o valor de sua participação.", "C": "A responsabilidade dos sócios de uma cooperativa é sempre limitada ao valor do capital social, mas todos respondem solidária e ilimitadamente pela sua integralização.", "D": "Sob pena de nulidade, o capital social da cooperativa deverá ser igual ou superior a 100 salários mínimos, que também será variável durante toda sua existência."}, fb:{"A": "Incorreta. A cooperativa registra-se na Junta Comercial (não no RCPJ), e o estatuto é arquivado lá — não precisa de aprovação prévia.", "B": "Correta! Art. 1.094, V, CC: um cooperado = um voto, independentemente do valor de sua participação no capital.", "C": "Incorreta. A responsabilidade pode ser limitada OU ilimitada, conforme o estatuto — não é sempre limitada.", "D": "Incorreta. Não existe capital mínimo de 100 salários mínimos para cooperativas. O capital é variável, isso sim."}, fund:"Art. 1.094, V, CC: na cooperativa, cada sócio tem direito a um voto, independentemente do capital. Art. 1.093, CC: as cooperativas registram-se na Junta Comercial. Responsabilidade: pode ser limitada ou ilimitada (art. 1.095, CC).", caqui:"Cooperativa: um cooperado = um voto — não importa quanto você investiu. É a gestão democrática. Compare com a S.A.: lá, mais ações = mais votos. Na cooperativa, não."},
  {num:21, exame:"XXVI Exame — 2018", titulo:"Responsabilidade dos Acionistas na Companhia Fechada", enunciado:"Leandro, Alcides e Inácio pretendem constituir uma companhia fechada por subscrição particular do capital. A sociedade será administrada por Inácio e sua irmã, que não será sócia.", comando:"Considerando o tipo societário e a responsabilidade legal dos sócios a ele inerente, assinale a afirmativa correta.", gabarito:"A", alt:{"A": "Leandro, Alcides e Inácio responderão limitadamente até o preço de emissão das ações por eles subscritas.", "B": "Leandro, Alcides e Inácio responderão limitadamente até o valor das quotas por eles subscritas, mas solidariamente pela integralização do capital.", "C": "Leandro, Alcides e Inácio responderão ilimitada, solidária e subsidiariamente pelas obrigações sociais.", "D": "Leandro e Alcides responderão limitadamente até o preço de emissão das ações por eles subscritas, e Inácio, como administrador, ilimitada e subsidiariamente, pelas obrigações sociais."}, fb:{"A": "Correta! Art. 1º, LSA: na S.A., a responsabilidade dos acionistas é limitada ao preço de emissão das ações subscritas ou adquiridas.", "B": "Incorreta. S.A. tem ações — não quotas. Terminologia errada invalida a alternativa.", "C": "Incorreta. Responsabilidade dos acionistas é limitada — não ilimitada.", "D": "Incorreta. O simples exercício da administração não torna o acionista automaticamente responsável ilimitado. Responsabilidade do administrador existe por atos ilícitos específicos."}, fund:"Art. 1º, Lei 6.404/76 (LSA): a responsabilidade do acionista é limitada ao preço de emissão das ações subscritas. O administrador não acionista responde por atos ilícitos (art. 158, LSA) — não pelo simples exercício do cargo.", caqui:"Na S.A., o teto da responsabilidade é o preço de emissão das ações. Ponto. Não confunda com limitada (que usa quotas). Ser administrador da S.A. não cria responsabilidade pessoal automática pelas dívidas sociais — só em casos de abuso ou ilegalidade."},
  {num:22, exame:"XXIV Exame — 2017", titulo:"Responsabilidade dos Sócios na Sociedade Limitada", enunciado:"Miguel e Paulo pretendem constituir uma sociedade do tipo limitada. Na consulta a um advogado, foram informados de que, nesse tipo societário, todos os sócios respondem", comando:"Assinale a afirmativa correta.", gabarito:"A", alt:{"A": "Solidariamente pela integralização do capital social.", "B": "Até o valor da quota de cada um, sem solidariedade entre si e em relação à sociedade.", "C": "Até o valor da quota de cada um, após cinco anos da data do arquivamento do contrato.", "D": "Solidariamente pelas obrigações sociais."}, fb:{"A": "Correta! Art. 1.052, CC: cada sócio responde até o valor de suas quotas, MAS todos respondem solidariamente pela integralização do capital social.", "B": "Incorreta. Existe solidariedade — pela integralização do capital.", "C": "Incorreta. O prazo de cinco anos se refere à decadência do direito de anular atos, não à responsabilidade dos sócios.", "D": "Incorreta. Os sócios não respondem solidariamente por todas as obrigações sociais — apenas pela integralização do capital."}, fund:"Art. 1.052, CC: na limitada, cada sócio responde até o valor de suas quotas, mas todos respondem solidariamente pela integralização do capital social.", caqui:"A responsabilidade na limitada tem dois níveis: cada um responde pelo valor de suas próprias quotas; e solidariamente pela integralização do capital total. A solidariedade existe, mas só para integralização do capital, não para todas as obrigações sociais."},
  {num:23, exame:"XXIII Exame — 2017", titulo:"Responsabilidade dos Herdeiros do Sócio Falecido", enunciado:"Em 11 de setembro de 2016, ocorreu o falecimento de Pedro, sócio de uma sociedade simples. O contrato prevê a resolução da sociedade em relação a um sócio. Na alteração contratual ficou estabelecida a redução do capital no valor das quotas titularizadas pelo ex-sócio, sendo o documento arquivado no Registro Civil de Pessoas Jurídicas em 22 de outubro de 2016.", comando:"Os herdeiros de Pedro são responsáveis pelas obrigações sociais anteriores à data do falecimento, até dois anos após", gabarito:"B", alt:{"A": "A data da resolução da sociedade e pelas posteriores e em igual prazo, a partir de 11 de setembro de 2016.", "B": "A data do arquivamento da resolução da sociedade (22 de outubro de 2016).", "C": "A data da resolução da sociedade em relação ao sócio Pedro (11 de setembro de 2016).", "D": "A data do arquivamento da resolução da sociedade e pelas posteriores e em igual prazo, a partir de 22 de outubro de 2016."}, fb:{"A": "Incorreta. O prazo não conta da data da resolução (morte), mas da averbação. E herdeiros não respondem por obrigações POSTERIORES ao falecimento.", "B": "Correta! Art. 1.032, CC: os herdeiros respondem pelas obrigações sociais ANTERIORES à resolução, pelo prazo de 2 anos contados do ARQUIVAMENTO da resolução (22/10/2016).", "C": "Incorreta. O termo inicial é o arquivamento (22/10/2016), não a data do falecimento (11/09/2016).", "D": "Incorreta. Os herdeiros respondem apenas por obrigações ANTERIORES — não pelas posteriores ao falecimento."}, fund:"Art. 1.032, CC: na retirada, exclusão ou morte do sócio, os herdeiros respondem pelas obrigações sociais anteriores, até 2 anos após a averbação da resolução da sociedade.", caqui:"Dois detalhes que fazem toda diferença: o prazo de 2 anos conta do ARQUIVAMENTO, não da morte; e herdeiros só respondem por dívidas ANTERIORES ao falecimento. Separa: arquivamento = início do prazo; anterior ao óbito = escopo das dívidas."},
  {num:24, exame:"XXI Exame — 2016", titulo:"Transferência de Ações Preferenciais Escriturais", enunciado:"Bernardino adquiriu de Lorena ações preferenciais escriturais da companhia Campos Logística S/A e recebeu orientação de como se dará a formalização da transferência da propriedade.", comando:"A resposta do advogado é a de que a transferência das ações se opera", gabarito:"C", alt:{"A": "Pelo extrato a ser fornecido pela instituição custodiante, na qualidade de proprietária fiduciária das ações.", "B": "Pela inscrição do nome de Bernardino no livro de Registro de Ações Nominativas em poder da companhia.", "C": "Pelo lançamento efetuado pela instituição depositária em seus livros, a débito da conta de ações de Lorena e a crédito da conta de ações de Bernardino.", "D": "Por termo lavrado no livro de Transferência de Ações Nominativas, datado e assinado por Lorena e por Bernardino ou por seus legítimos representantes."}, fb:{"A": "Incorreta. O extrato comprova a titularidade, mas não opera a transferência.", "B": "Incorreta. Essa regra é das ações nominativas NÃO escriturais.", "C": "Correta! Art. 35, §1º, LSA: ações escriturais transferem-se por lançamento na instituição depositária — débito na conta do vendedor e crédito na conta do comprador.", "D": "Incorreta. Essa regra é das ações nominativas não escriturais (livros físicos da companhia)."}, fund:"Art. 35, §1º, LSA: a transferência de ações escriturais opera-se pelo lançamento efetuado pela instituição depositária em seus livros, a débito da conta do alienante e a crédito da conta do adquirente.", caqui:"Ações escriturais = sem papel, sem livro físico da companhia. A transferência é eletrônica: débito na conta de quem vende e crédito na conta de quem compra. Compare com ações nominativas físicas: lá é no livro da companhia."},
  {num:25, exame:"XX Exame — 2016", titulo:"Prova da Sociedade em Comum e Responsabilidade pelos Atos de Gestão", enunciado:"Sebastião e Marcelo constituíram uma sociedade sem que o documento de constituição tivesse sido levado a registro. Marcelo assumiu uma dívida em seu nome pessoal, mas no interesse da sociedade. Barros é credor de Marcelo pela referida obrigação.", comando:"Barros poderá provar a existência da sociedade", gabarito:"A", alt:{"A": "De qualquer modo, e os bens sociais respondem pelos atos de gestão praticados por Marcelo.", "B": "Somente por escrito, e os bens sociais respondem pelos atos de gestão praticados por Marcelo.", "C": "De qualquer modo, e somente os bens particulares de Marcelo respondem pelos atos de gestão por ele praticados.", "D": "Somente por escrito, e os bens particulares de Marcelo e Sebastião respondem pelos atos de gestão praticados por Marcelo."}, fb:{"A": "Correta! Art. 987, CC: terceiros podem provar a existência da sociedade em comum de qualquer modo. Art. 988, CC: os bens sociais respondem pelos atos de gestão praticados em interesse da sociedade.", "B": "Incorreta. Prova exclusivamente por escrito é exigida apenas dos próprios sócios — não de terceiros.", "C": "Incorreta. Os bens SOCIAIS também respondem pelos atos de gestão — não apenas os particulares de Marcelo.", "D": "Incorreta. Terceiro pode provar de qualquer modo, e os bens sociais também respondem."}, fund:"Art. 987, CC: entre sócios, prova apenas por escrito. Para terceiros, de qualquer modo. Art. 988, CC: a sociedade em comum tem patrimônio especial (bens sociais) que responde pelos atos praticados em seu interesse.", caqui:"Regra simétrica: sócio prova por escrito. Terceiro prova de qualquer jeito. Além disso, há bens sociais (patrimônio especial) que respondem — não são só os bens de Marcelo."},
  {num:26, exame:"XX Exame — 2016", titulo:"Eficácia da Renúncia do Administrador de Sociedade Limitada", enunciado:"Na sociedade Apuí Veículos Ltda., a sócia Eva foi eleita administradora para um mandato de três anos. Em razão de insuperáveis divergências, Eva renunciou ao cargo após um ano de sua investidura.", comando:"A eficácia da renúncia de Eva se dará, em relação à sociedade, desde o momento em que", gabarito:"C", alt:{"A": "A assembleia de sócios ratifica o ato de Eva; e, em relação a terceiros, após a averbação da renúncia.", "B": "É designado novo administrador para substituir Eva; e, em relação a terceiros, após a averbação ou publicação da renúncia.", "C": "Esta toma conhecimento da comunicação escrita de Eva; e, em relação a terceiros, após a averbação e publicação da renúncia.", "D": "O termo de renúncia de Eva é lavrado no livro de atas da administração; e, em relação a terceiros, após a publicação da renúncia."}, fb:{"A": "Incorreta. Não há necessidade de ratificação pela assembleia.", "B": "Incorreta. Não é necessário designar substituto para a renúncia produzir efeitos.", "C": "Correta! Art. 1.063, §3º, CC: eficácia interna = quando a sociedade toma conhecimento da comunicação escrita. Eficácia externa = após averbação E publicação.", "D": "Incorreta. O simples registro em livro de atas não é o marco da eficácia interna — é o conhecimento da comunicação escrita."}, fund:"Art. 1.063, §3º, CC: a renúncia do administrador torna-se eficaz em relação à sociedade quando esta toma conhecimento da comunicação escrita; e em relação a terceiros, após a averbação e publicação.", caqui:"A renúncia tem dois momentos: para a sociedade, vale quando ela lê a comunicação escrita de Eva. Para terceiros, vale só depois da averbação E publicação — as duas juntas. A banca adora colocar averbação OU publicação como pegadinha."},
  {num:27, exame:"XX Exame — 2016", titulo:"Alienação de Unidade Produtiva Integrante do Estabelecimento", enunciado:"P. Industrial S.A., companhia fechada, passa por dificuldades financeiras. A assembleia geral autorizou os administradores a alienar bens do ativo permanente, dentre eles uma unidade produtiva que integra seu estabelecimento.", comando:"Assinale a afirmativa correta.", gabarito:"B", alt:{"A": "A assembleia geral não pode autorizar a alienação da unidade produtiva. Por ser o estabelecimento uma universalidade de direito, seus elementos devem ser mantidos indivisíveis e unitariamente agregados para o exercício da empresa.", "B": "A assembleia geral pode autorizar a alienação da unidade produtiva. Por ser o estabelecimento uma universalidade de fato, seus elementos podem ser objeto de negócios jurídicos próprios, translativos ou constitutivos, separadamente dos demais.", "C": "A assembleia geral pode autorizar a alienação da unidade produtiva. Por ser o estabelecimento um patrimônio de afetação, cabe exclusivamente à companhia a decisão de desagregá-lo e, com isso, limitar sua responsabilidade perante os credores ao valor da unidade produtiva alienada.", "D": "A assembleia geral não pode autorizar a alienação da unidade produtiva. Por ser o estabelecimento elemento de exercício da empresa, a alienação de qualquer de seus elementos implica a impossibilidade de manutenção da atividade da companhia, operando-se sua dissolução de pleno direito."}, fb:{"A": "Incorreta. O estabelecimento é universalidade de FATO (não de direito), e seus elementos podem ser alienados separadamente.", "B": "Correta! Art. 1.142, CC + doutrina: o estabelecimento é universalidade de fato — conjunto organizado de bens que pode ser negociado em bloco ou em partes, sem que a alienação parcial implique dissolução da sociedade.", "C": "Incorreta. Estabelecimento não é patrimônio de afetação.", "D": "Incorreta. A alienação de parte do estabelecimento não dissolve automaticamente a sociedade."}, fund:"Art. 1.142, CC: estabelecimento empresarial = complexo de bens organizado para o exercício da empresa. É universalidade de fato — seus elementos podem ser negociados separadamente.", caqui:"O estabelecimento é um conjunto de bens, mas não é indivisível. É universalidade de fato — pode vender uma peça sem vender o todo. Diferente de universalidade de direito (como a herança, que se transfere em bloco). Vender uma fábrica não dissolve a empresa."},
  {num:28, exame:"XVIII Exame — 2015", titulo:"Morte de Sócio na Sociedade Simples — Omissão Contratual", enunciado:"O contrato da sociedade do tipo simples Angélica Médicos Associados é omisso quanto à possibilidade de sucessão por morte de sócio. Inocência, uma das sócias, consulta você para saber qual a regra prevista no Código Civil para esse caso.", comando:"Você respondeu corretamente que, com a morte de sócio,", gabarito:"C", alt:{"A": "Opera-se a dissolução da sociedade de pleno direito. Caberá a liquidação da quota do sócio falecido, cujo valor, considerado pelo montante efetivamente realizado, será apurado com base no último balanço aprovado, salvo disposição contratual em contrário.", "B": "Opera-se a sucessão dos herdeiros do sócio falecido na sociedade. Os herdeiros poderão pleitear o levantamento de balanço de resultado econômico para verificação da situação patrimonial da sociedade à data do óbito, salvo disposição contratual em contrário.", "C": "Opera-se a resolução da sociedade em relação ao sócio falecido. Caberá a liquidação da quota do falecido, cujo valor, considerado pelo montante efetivamente realizado, será apurado com base na situação patrimonial da sociedade à data do óbito, verificada em balanço especialmente levantado, salvo disposição contratual em contrário.", "D": "Opera-se a substituição do sócio falecido mediante acordo dos sócios remanescentes com os herdeiros. Os herdeiros poderão pleitear a liquidação da quota com base no valor econômico da sociedade, a ser apurado em avaliação por três peritos ou por sociedade especializada, mediante laudo fundamentado, salvo disposição contratual em contrário."}, fb:{"A": "Incorreta. Não há dissolução total da sociedade — apenas resolução em relação ao sócio falecido. E a base de cálculo é a situação patrimonial na data do óbito (balanço especial), não o último balanço aprovado.", "B": "Incorreta. Herdeiros não entram automaticamente na sociedade — essa é a exceção, não a regra.", "C": "Correta! Arts. 1.028 e 1.031, CC: morte do sócio = resolução da sociedade apenas em relação ao falecido + liquidação da quota com base na situação patrimonial na data do óbito, apurada em balanço especialmente levantado.", "D": "Incorreta. A substituição por acordo com herdeiros é possível (art. 1.028, III), mas não é a regra automática — é uma exceção."}, fund:"Arts. 1.028 e 1.031, CC: na omissão contratual, morte de sócio gera resolução da sociedade em relação ao falecido. Quota liquidada com base na situação patrimonial na data do óbito, em balanço especialmente levantado.", caqui:"Morte de sócio na sociedade simples sem cláusula: resolução parcial (não dissolve tudo), liquidação da quota com balanço especial levantado na data do óbito. O balanço é feito especialmente para isso — não é o último aprovado. Herdeiro não entra automaticamente."},

let current=0;
const estado=Array(QUESTOES.length).fill(null);

function init(){
  const nav=document.getElementById('nav-wrap');
  const container=document.getElementById('questions-container');
  QUESTOES.forEach((q,i)=>{
    const nb=document.createElement('button');
    nb.className='nav-btn'+(i===0?' active':'');
    nb.textContent=i+1;nb.onclick=()=>goTo(i);nb.id='nav-'+i;
    nav.appendChild(nb);
    const card=document.createElement('div');
    card.className='q-card'+(i===0?' visible':'');card.id='card-'+i;
    card.innerHTML=buildCard(q,i);container.appendChild(card);
  });
  updatePagination();updateScore();
}

function buildCard(q,i){
  const alts=Object.entries(q.alt).map(([l,t])=>`<button class="alt-btn" onclick="responder(${i},'${l}',this)" data-letra="${l}"><span class="alt-letter">${l}</span><span class="alt-text">${t}</span></button>`).join('');
  return `<div class="q-header"><span class="q-num">Questão ${q.num}</span>${q.exame?`<span class="q-exame">${q.exame}</span>`:''}</div>
    <h2 class="q-titulo">${q.titulo}</h2>
    <div class="enunciado">${q.enunciado}</div>
    <p class="comando">${q.comando}</p>
    <div class="alternativas" id="alts-${i}">${alts}</div>
    <div class="feedback" id="fb-${i}"></div>
    <div class="fundamento-box" id="fund-${i}"><h4>📖 Fundamento legal</h4>${q.fund}</div>
    <div class="caqui-box" id="caqui-${i}"><h4>🍊 Explicação didática do Professor Caqui</h4>${q.caqui}</div>
    <div class="card-actions"><div class="btn-group">
      <button class="btn roxo" id="btn-fund-${i}" onclick="toggleFund(${i})">Ver fundamento legal</button>
      <button class="btn caqui" id="btn-caqui-${i}" onclick="toggleCaqui(${i})">Explicação do Prof. Caqui</button>
      <button class="btn" id="btn-reset-${i}" onclick="resetQ(${i})">↺ Tentar novamente</button>
    </div><span class="status-text" id="status-${i}"></span></div>`;
}

function responder(idx,letra,btn){
  if(estado[idx]!==null)return;
  estado[idx]=letra;
  const q=QUESTOES[idx];
  document.querySelectorAll(`#alts-${idx} .alt-btn`).forEach(b=>{
    b.disabled=true;
    if(b.dataset.letra===q.gabarito)b.classList.add('correct');
    if(b.dataset.letra===letra&&letra!==q.gabarito)b.classList.add('wrong');
  });
  const acertou=letra===q.gabarito;
  const fb=document.getElementById('fb-'+idx);
  fb.className='feedback show '+(acertou?'acerto':'erro');
  fb.innerHTML=`<strong>${acertou?'✓ Correta!':'✗ Incorreta.'}</strong> ${q.fb[letra]}`;
  document.getElementById('status-'+idx).textContent=acertou?'Acerto!':'Gabarito: '+q.gabarito;
  document.getElementById('btn-reset-'+idx).className='btn show';
  document.getElementById('btn-fund-'+idx).className='btn roxo show';
  document.getElementById('btn-caqui-'+idx).className='btn caqui show';
  const navBtn=document.getElementById('nav-'+idx);
  navBtn.classList.remove('active');navBtn.classList.add(acertou?'correto':'errado');
  if(idx===current)navBtn.classList.add('active');
  updateScore();
}

function toggleFund(idx){
  const box=document.getElementById('fund-'+idx);
  const btn=document.getElementById('btn-fund-'+idx);
  const v=box.classList.contains('show');
  box.className=v?'fundamento-box':'fundamento-box show';
  btn.textContent=v?'Ver fundamento legal':'Ocultar fundamento';
}

function toggleCaqui(idx){
  const box=document.getElementById('caqui-'+idx);
  const btn=document.getElementById('btn-caqui-'+idx);
  const v=box.classList.contains('show');
  box.className=v?'caqui-box':'caqui-box show';
  btn.textContent=v?'Explicação do Prof. Caqui':'Ocultar explicação';
}

function resetQ(idx){
  estado[idx]=null;
  document.querySelectorAll(`#alts-${idx} .alt-btn`).forEach(b=>{b.disabled=false;b.className='alt-btn';});
  document.getElementById('fb-'+idx).className='feedback';
  document.getElementById('fund-'+idx).className='fundamento-box';
  document.getElementById('btn-fund-'+idx).className='btn roxo';
  document.getElementById('btn-fund-'+idx).textContent='Ver fundamento legal';
  document.getElementById('caqui-'+idx).className='caqui-box';
  document.getElementById('btn-caqui-'+idx).className='btn caqui';
  document.getElementById('btn-caqui-'+idx).textContent='Explicação do Prof. Caqui';
  document.getElementById('btn-reset-'+idx).className='btn';
  document.getElementById('status-'+idx).textContent='';
  document.getElementById('nav-'+idx).className='nav-btn'+(idx===current?' active':'');
  updateScore();
}

function goTo(idx){
  document.getElementById('card-'+current).classList.remove('visible');
  document.getElementById('nav-'+current).classList.remove('active');
  current=idx;
  document.getElementById('card-'+current).classList.add('visible');
  document.getElementById('nav-'+current).classList.add('active');
  updatePagination();window.scrollTo({top:0,behavior:'smooth'});
}

function navPage(dir){const next=current+dir;if(next>=0&&next<QUESTOES.length)goTo(next);}

function updatePagination(){
  document.getElementById('pg-info').textContent=(current+1)+' de '+QUESTOES.length;
  document.getElementById('btn-prev').disabled=current===0;
  document.getElementById('btn-next').disabled=current===QUESTOES.length-1;
}

function updateScore(){
  const respondidas=estado.filter(e=>e!==null).length;
  const acertos=estado.filter((e,i)=>e===QUESTOES[i].gabarito).length;
  const erros=respondidas-acertos;
  document.getElementById('sc-total').textContent=respondidas;
  document.getElementById('sc-acertos').textContent=acertos;
  document.getElementById('sc-erros').textContent=erros;
  const pct=Math.round((respondidas/QUESTOES.length)*100);
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('progress-label').textContent=respondidas+' de '+QUESTOES.length+' respondidas';
}

init();
</script>
</body>
</html>
